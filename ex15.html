<!DOCTYPE html>
<html lang="en">

<body>

<script>
    let j = Number(prompt("Numero jour 1-7"));
    if(j==1) alert("lundi");
    else if(j==2) alert("mardi");
    else if(j==3) alert("mercredi");
    else if(j==4) alert("jeudi");
    else if(j==5) alert("vendredi");
    else if(j==6) alert("samedi");
    else if(j==7) alert("dimanche");
    else alert("erreur: valeur invalide");
</script>

</body>
</html>
