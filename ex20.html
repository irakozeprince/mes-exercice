<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>
    let a = Number(prompt("1er reel :"));
    let b = Number(prompt("2er reel :"));
    let c = prompt("choix: 1 somme 2 diff 3 prod 4 quot 5 reste -1 arret");
    if(c==1) alert(a+b);
    else if(c==2) alert(a-b);
    else if(c==3) alert(a*b);
    else if(c==4) alert(a/b);
    else if(c==5) alert(a%b);
    else alert("arret");
   
</script>

</body>
</html>
