<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>
    let r="";
    for(let n=10;n<=100;n++){
        let p=true;
        for(let i=2;i<n;i++) if(n%i==0) p=false;
        if(p) r+n+"";
    }
    alert(r);
   
</script>

</body>
