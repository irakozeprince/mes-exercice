<body>

<script>
    let n =Number(prompt("entrez un nombre entre 1 et 5 :"))
    if(n===1){
        console.log("un") 
    }
    else if(n===2){
        console.log("deux")
    } 
    else if(n===3){
        console.log("trois")
    }
    else if (n===4){
        console.log("quatre")
    }
    else if(n===5){
        console.log("cinq")
    }
    else{
        console.log("erreur")
    }
</script>
